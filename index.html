<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glochic Official</title>
    <style>
        body {
            margin: 0;
            font-family: "Helvetica", "Arial", sans-serif;
            background: #000;
            color: #fff;
        }

        /* ヘッダー */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 10px;
            z-index: 1000;
        }

        .menu-btn {
            width: 30px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block;
            height: 3px;
            background: #fff;
            margin: 6px 0;
        }

        /* メニュー */
        .menu {
            display: none;
            background: #111;
            padding: 20px;
        }
        .menu.open {
            display: block;
        }
        .menu ul {
            list-style: none;
            padding: 0;
        }
        .menu li {
            margin: 10px 0;
        }
        .menu a {
            color: #fff;
            text-decoration: none;
        }

        /* TOP */
        .top {
            position: relative;
            text-align: center;
            padding-top: 60px;
        }
        .top-img {
            width: 100%;
            height: auto;
        }
        .top-buttons {
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: 1px solid #fff;
            margin: 0 10px;
            text-decoration: none;
            color: #fff;
        }
        .btn-outline {
            background: transparent;
        }

        .about h2, .archive h2 {
            text-align: center;
        }

        /* ARCHIVE グリッド */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
        }
        .archive-item img {
            width: 100%;
            display: block;
        }

        /* SNS */
        .sns-icons img {
            width: 40px;
            margin: 10px;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .lightbox img {
            width: 80%;
            max-width: 500px;
        }

        /* フッター */
        .footer {
            text-align: center;
            padding: 20px;
            background: #111;
        }

        /* スマホ対応（600px以下でも横並び維持） */
        @media (max-width: 600px) {
            .about-archive-wrapper {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .about, .archive {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

<header class="header">
   <div class="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
   </div>
</header>

<nav id="menu" class="menu">
    <ul>
        <li><a href="#top">TOP</a></li>
        <li><a href="#about">ABOUT</a></li>
        <li><a href="#archive">ARCHIVE</a></li>
        <li><a href="#sns">SNS</a></li>
        <li><a href="#contact">CONTACT</a></li>
    </ul>
</nav>

<section id="top" class="top">
    <picture>
        <source srcset="images/sumaaho-Header.png" media="(max-width: 600px)">
        <img src="images/glochic-header.png" class="top-img" alt="Glochic Header">
    </picture>

    <div class="top-buttons">
        <a href="#about" class="btn">ABOUT</a>
        <a href="#archive" class="btn btn-outline">ARCHIVE</a>
    </div>
</section>

<section id="about" class="about">
    <h2>ABOUT Glochic</h2>
    <p>
        流行ではなく、<br>
        違和感を纏うために。<br><br>
        静かな棘と毒を、<br>
        日常に落とし込む。<br><br>
        Glochic は、あなたの“ありのまま”を愛するブランドです。
    </p>

<section id="archive" class="archive">
    <h2>Glochic Archive</h2>

        <div class="archive-item" data-caption="作品 03">

        </div>
        <div class="archive-item" data-caption="作品 04">
            <img src="images/work04.png" alt="作品 04">
        </div>
        <div class="archive-item" data-caption="作品 05">
            <img src="images/work05.png" alt="作品 05">
        </div>
        <div class="archive-item" data-caption="作品 06">

        </div>

        <div class="archive-item" data-caption="作品 08">

        <div class="archive-item" data-caption="作品 09">

        </div>
        <div class="archive-item" data-caption="作品 10">
            <img src="images/work10.png" alt="作品 10">
        </div>
        <div class="archive-item" data-caption="作品 11">
            <img src="images/work11.png" alt="作品 11">
        </div>
        <div class="archive-item" data-caption="作品 12">
            <img src="images/work12.png" alt="作品 12">
        </div>
    </div>
</section>

</div><!-- /about-archive-wrapper -->

<div id="lightbox" class="lightbox">
    <img id="lightbox-img" alt="">
    <p id="lightbox-caption"></p>
</div>

<section id="sns" class="sns">
    <h2>SNS</h2>
    <div class="sns-icons">
        <a href="https://x.com/glochic_?s=21" target="_blank">
            <img src="images/twitter.png" alt="Twitter">
        </a>
        <a href="https://www.instagram.com/glochic_?igsh=MTh5bng0ZW1qOHg1aw==" target="_blank">
            <img src="images/instagram.png" alt="Instagram">
        </a>
        <a href="https://tiktok.com/" target="_blank">
            <img src="images/tiktok.png" alt="TikTok">
        </a>
        <a href="https://jp.mercari.com/user/profile/672286854/" target="_blank">
            <img src="images/mercari.png" alt="Mercari">
        </a>
        <a href="https://220.base.ec/" target="_blank">
            <img src="images/base.png" alt="BASE">

    </div>
</section>

<section id="contact" class="contact">
    <h2>CONTACT</h2>
    <p>
        コラボレーション、イベント出展、作品に関するご相談は、<br>
        メールまたはSNSのDMからご連絡ください。<br><br>
        official.glochic@gmail.com
    </p>
</section>

<footer class="footer">
    <p>© 2026 Glochic</p>
</footer>

<script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("open");
}

document.querySelectorAll(".archive-item").forEach(item => {
    item.addEventListener("click", () => {
        const img = item.querySelector("img");
        document.getElementById("lightbox").style.display = "flex";
        document.getElementById("lightbox-img").src = img.src;
        document.getElementById("lightbox-caption").textContent = item.getAttribute("data-caption");
    });
});

document.getElementById("lightbox").addEventListener("click", () => {
    document.getElementById("lightbox").style.display = "none";
});
</script>

</body>
</html>
